name: Security CI

on:
  push:
    branches: [main, master, release/clearnet-rc1-public]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go test, vet, and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Static analysis
        working-directory: backend
        run: go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan reachable Go vulnerabilities
        working-directory: backend
        run: govulncheck ./...

  web:
    name: Web test, typecheck, build, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run web tests
        working-directory: web
        run: npm test
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Audit all dependencies (policy gate)
        working-directory: web
        run: node --import tsx scripts/audit-policy.mts
      - name: Audit production dependencies (policy gate)
        working-directory: web
        run: node --import tsx scripts/audit-policy.mts --production

  configuration:
    name: Compose and secret validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test security CI and Compose checker contracts
        run: |
          ./deploy/scripts/check-security-ci.test.sh
          ./deploy/scripts/check-compose-config.test.sh
          ./deploy/scripts/check-edge-identity.test.sh
          ./deploy/scripts/check-clearnet-compose-command.test.sh
          ICEQ_ENV_FILE=.env.example ./deploy/scripts/check-clearnet-compose.sh
      - name: Scan repository for secrets
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -eu
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          extractdir="$RUNNER_TEMP/gitleaks-extract"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$extractdir" "$bindir"
          tar -xzf "$archive" -C "$extractdir" gitleaks
          install -m 0755 "$extractdir/gitleaks" "$bindir/gitleaks"
          export PATH="$bindir:$PATH"
          gitleaks detect --source . --redact --no-banner
      - name: Validate Compose model
        run: ./deploy/scripts/check-compose-config.sh

  e2e:
    name: Playwright E2E (Chromium + WebKit)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Start disposable acceptance stack
        run: |
          docker compose -f deploy/docker-compose.acceptance.yml up -d --wait
          docker compose -f deploy/docker-compose.acceptance.yml ps
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium webkit --with-deps
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Run Playwright E2E
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
      - name: Tear down acceptance stack
        if: always()
        run: docker compose -f deploy/docker-compose.acceptance.yml down -v

  acceptance:
    name: Panic Wipe five-storage acceptance
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Start disposable acceptance stack
        run: |
          docker compose -f deploy/docker-compose.acceptance.yml up -d --wait
          docker compose -f deploy/docker-compose.acceptance.yml ps
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Initialize PostgreSQL schema
        run: |
          cat deploy/init/postgres-init.sql | \
            docker compose -f deploy/docker-compose.acceptance.yml exec -T postgres \
            psql -U postgres -d iceq
      - name: Run five-storage acceptance test
        working-directory: backend
        env:
          ICEQ_ACCEPTANCE: "1"
          ICEQ_ACCEPTANCE_PG_URL: "postgres://postgres:postgres@localhost:5434/iceq?sslmode=disable"
          ICEQ_TEST_PG_URL: "postgres://postgres:postgres@localhost:5434/iceq?sslmode=disable"
          ICEQ_ACCEPTANCE_REDIS_ADDR: "localhost:6380"
          ICEQ_ACCEPTANCE_REDIS_PASSWORD: "iceq-acceptance-redis"
          ICEQ_ACCEPTANCE_SCYLLA_HOSTS: "localhost:9043"
          ICEQ_ACCEPTANCE_NATS_URL: "nats://localhost:4223"
          ICEQ_ACCEPTANCE_NATS_TOKEN: "iceq-acceptance-nats"
          ICEQ_ACCEPTANCE_MINIO_ENDPOINT: "localhost:9002"
          ICEQ_ACCEPTANCE_MINIO_ACCESS_KEY: "minioadmin"
          ICEQ_ACCEPTANCE_MINIO_SECRET_KEY: "minioadmin"
        run: |
          set -o pipefail
          go test -count=1 -race -tags=integration -v ./auth-service/handlers/ 2>&1 | tee acceptance-output.txt
      - name: Print failure output
        if: failure()
        working-directory: backend
        run: cat acceptance-output.txt
      - name: Tear down acceptance stack
        if: always()
        run: docker compose -f deploy/docker-compose.acceptance.yml down -v
