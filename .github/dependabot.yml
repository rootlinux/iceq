version: 2
updates:
  # ── Go modules ──────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go

  # ── npm (web frontend) ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    ignore:
      # Major version bumps need manual review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Docker images (Dockerfiles) ─────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/backend/auth-service"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/backend/key-service"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/backend/ws-gateway"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/backend/message-service"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/backend/presence-service"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/backend/file-service"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/backend/edge-identity"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/web"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
